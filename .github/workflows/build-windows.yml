name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'installer/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/CpiScreenRecorder/CpiScreenRecorder.csproj -p:Platform=x64

      - name: Publish self-contained Windows x64
        run: >-
          dotnet publish src/CpiScreenRecorder/CpiScreenRecorder.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/CpiScreenRecorder.iss

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: CPI-Screen-Recorder-v0.1-portable
          path: artifacts/publish/
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CPI-Screen-Recorder-v0.1-Setup
          path: artifacts/installer/CPI-Screen-Recorder-Setup.exe
          if-no-files-found: error
